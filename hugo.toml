baseURL = "https://paddleboard.dev/"
title = "PaddleBoard"
enableRobotsTXT = true
# Source <lastmod> in the sitemap from git commit dates (the deploy checks out
# full history, fetch-depth: 0).
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[languages.en]
  locale = "en-US"
  label = "English"
  weight = 1

[markup.goldmark.renderer]
  unsafe = true

[params]
  # SEO: front-load the terms people search ("open source AI IDE", "AI harness").
  seotitle = "Open-Source AI IDE & Coding-Agent Harness"
  description = "PaddleBoard is an open-source AI IDE and harness for coding agents — define who your agent should be with PERSONA.md, bring your own model keys, and manage agents, skills, and MCP servers. Telemetry off by default."
  keywords = "open source AI IDE, open source AI harness, AI IDE, AI code editor, agentic IDE, coding agent harness, AI agent workbench, agentic coding, AI agent persona, PERSONA.md, MCP client, bring your own key LLM, Zed fork, local-first AI editor"
  tagline = "The open-source AI IDE you actually own."
  subtitle = "PaddleBoard is an open-source, AI-native IDE — a local-first harness for coding agents. Tell your agent who to be with a PERSONA.md, bring your own model keys, and manage agents, skills, and MCP servers from one place. No telemetry, no hosted plan."
  repo = "https://github.com/paddleboarddev/paddleboard"
  docs = "https://docs.paddleboard.dev"
  bluesky = "https://bsky.app/profile/paddleboard.dev"
  # Latest published release. Bump on each release (the tag must exist at repo/releases/tag/<version>).
  version = "v0.2.5"

  # The narrative sections of the home page, in order. `token` picks the syntax
  # colour of the label, matching PaddleBoard Dark's own theme values. Each one
  # is anchored to a real product screenshot in static/img/.
  [[params.sections]]
    token = "kw"
    label = "persona"
    title = "Tell your agent who to be"
    body = "A <code>PERSONA.md</code> in your repo sets the voice, the constraints, and the house style — for the built-in agent, for subagents, and for Scion. Compose them with <code>extends:</code>. No prompt copy-paste between projects."
    image = "img/persona.png"
    caption = "AI Dock — Personas: discovered from the repo, plus a starter library"

  [[params.sections]]
    token = "fn"
    label = "models"
    title = "Bring your own keys — or no keys at all"
    body = "Anthropic, OpenAI, Google, Vertex, Bedrock, or any OpenAI-compatible endpoint. Or run nothing but local: PaddleBoard ships a managed llama.cpp and Gemma weights, so a fresh install can talk to a model without an account."
    image = "img/models.png"
    caption = "Every provider in one list — including Local Models"

  [[params.sections]]
    token = "str"
    label = "dock"
    title = "Every agent surface in one place"
    body = "Agents, skills, MCP servers, personas, and token usage — the AI Dock is the one window where you install, configure, and watch all of it. No scattered config files."
    image = "img/dock.png"
    caption = "AI Dock — Agents: Claude, Codex, Copilot, Cursor, Antigravity"

  # Copy deliberately narrow: the built-in tier covers one-shot commands only.
  # Services, sandboxed MCP and REPL kernels still need Podman — do not widen
  # this back to "zero setup".
  [[params.sections]]
    token = "ty"
    label = "sandbox"
    title = "Let it run, safely"
    body = "Agent-run code executes in a microVM, never on your filesystem. The built-in tier runs one-shot commands with nothing to install; Podman unlocks long-running services and sandboxed MCP. Every command still passes your approve/deny gate."
    image = "img/sandbox.png"
    caption = "Sandbox Backend — built-in microVM active"

  [[params.sections]]
    token = "num"
    label = "set sail"
    title = "Ship it from the editor"
    body = "Set Sail deploys to six serverless platforms using open skill packs from s8sskills.com, with a status-bar indicator that tells you where the build is."
    image = "img/setsail.png"
    caption = "Set Sail — six platforms, quick deploy or a full pipeline"

  # Last, and deliberately quieter: Scion is opt-in and self-installed, so it
  # must not read as a built-in feature.
  [[params.sections]]
    token = "com"
    label = "scion · add-on"
    title = "Give each agent its own worktree"
    body = "Scion is a separate tool you install yourself — PaddleBoard detects it and adds a launcher. Each agent gets its own git worktree and container, so several can work in parallel without colliding, each with its own persona."
    image = "img/scion.png"
    caption = "Start Scion Agent — task, template, persona"

  [[params.features]]
    icon = "🌐"
    title = "100% Open Source"
    body = "Every line is public — the editor, the docs, even the deploy playbooks. Fork it, audit it, own it. No hosted plan, no black boxes."

  [[params.features]]
    icon = "🔑"
    title = "Bring your own keys"
    body = "OpenAI, Anthropic, Google Gemini, AWS Bedrock, and more. No hosted plan, no upsells — you own the relationship with your model provider."

  [[params.features]]
    icon = "🔒"
    title = "Private by default"
    body = "Telemetry is hard-disabled at the source — events never queue, never log, never leave your machine. Even spelling and grammar checking runs fully offline. No account required."

  [[params.features]]
    icon = "🛟"
    title = "AI Dock"
    body = "Install and manage agents, skills, personas, and MCP servers from one place — with live logs and an orchestration panel for parallel work."

  [[params.features]]
    icon = "🎭"
    title = "Personas"
    body = 'Skills say what your agent can do — a PERSONA.md says who it should be. Describe a Senior Dev, an SRE, or a QA engineer and every thread holds that identity, with any model. Or just ask: "be my QA tester."'

  [[params.features]]
    icon = "🤖"
    title = "Agent workbench"
    body = "A first-class agent panel with delegation, plus support for ADK, LangGraph, CrewAI, and AutoGen agent frameworks out of the box."

  [[params.features]]
    icon = "🛡️"
    title = "Agent Sandbox"
    body = 'Agent-run code executes in ephemeral <a href="https://podman.io">Podman</a> containers under the <a href="https://gvisor.dev">gVisor</a> kernel sandbox — your project mounts in, your host stays out. Every command still passes your approve/deny gate.'

  [[params.features]]
    icon = "⛵"
    title = "Set Sail"
    body = 'Serverless-first deploys: ship straight to <a href="https://cloud.run">Cloud Run</a>, <a href="https://aws.amazon.com/pm/lambda">AWS Lambda</a>, or <a href="https://vercel.com">Vercel</a> in one click — the agent follows the open-source <a href="https://s8sskills.com">s8sskills</a> playbook and hands you the helm for auth.'

  [[params.features]]
    icon = "🗂️"
    title = "Manifest"
    body = "The ship's manifest for your repo: repositories, branches, commits, stashes, and contributors in one dockable tree. Click a commit for its diff or a stash to apply it — instant, local, no waiting on git."

  [[params.features]]
    icon = "🎨"
    title = "Ready from first launch"
    body = "Opens in PaddleBoard's own theme, then walks you to a working agent before you leave setup — run a model locally with no API key, or bring your own. A short guided tour shows you around."

  [[params.features]]
    icon = "⚓"
    title = "Built on Zed"
    body = "All of Zed's speed and multibuffer editing, inherited and kept in sync — with PaddleBoard's AI-native additions layered on top."
